# Nginx 反向代理示例：主站 data-analysis-web + 子路径 /wisdom-prompt 挂载 WisdomPrompt
# 使用前请复制为 nginx.conf 并根据实际域名/端口修改 server_name、端口等。
#
# 服务约定：
#   - data-analysis-web 前端：Next.js，端口 1256（与 secret-readme 一致）
#   - data-analysis-web 后端：Flask，默认 5000，API 前缀 /api/v1
#   - WisdomPrompt 前端：Vite，默认 5173，需设置 base=/wisdom-prompt/
#   - WisdomPrompt 后端：FastAPI，默认 8000，API 前缀 /api/v1
#
# 路由规则：
#   - /              -> Next (主站 1256)
#   - /api/v1/*      -> Flask 5000（主站 API）
#   - /wisdom-prompt/ -> WisdomPrompt 前端 (Vite 5173)
#   - /wisdom-prompt/api/ -> WisdomPrompt 后端 (8000)，路径重写为 /api/
#
# 防护：限流 + 连接数限制 + 安全头（可按需调整 rate/burst）

limit_req_zone $binary_remote_addr zone=req_per_ip:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

upstream data_analysis_next {
    server 127.0.0.1:1256;
}

upstream data_analysis_flask {
    server 127.0.0.1:5000;
}

upstream wisdom_prompt_vite {
    server 127.0.0.1:5173;
}

upstream wisdom_prompt_api {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name localhost;   # 生产请改为实际域名，如 example.com

    # 防护：全站限流与单 IP 连接数（可按需调大 burst / conn）
    limit_req zone=req_per_ip burst=20 nodelay;
    limit_conn conn_per_ip 30;

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 主站 API：Flask（必须在 /wisdom-prompt 之前匹配，避免被吞）
    location /api/v1/ {
        proxy_pass http://data_analysis_flask;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WisdomPrompt 后端 API：/wisdom-prompt/api/ -> 8000 的 /api/
    location /wisdom-prompt/api/ {
        rewrite ^/wisdom-prompt/api/(.*)$ /api/$1 break;
        proxy_pass http://wisdom_prompt_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # WisdomPrompt 前端：所有 /wisdom-prompt/ 请求交给 Vite（需配置 base=/wisdom-prompt/）
    location /wisdom-prompt/ {
        proxy_pass http://wisdom_prompt_vite;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
    }

    # 主站：Next.js
    location / {
        proxy_pass http://data_analysis_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
    }
}
